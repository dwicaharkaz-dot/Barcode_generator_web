<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Opname IDM T3EI + Scanner</title>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; margin:0; background:#ecf0f1; }
    .header-container { display:flex; justify-content:space-between; align-items:center;
                  padding:10px 20px; background:white; box-shadow:0 2px 5px rgba(0,0,0,0.1);}
    .header-container img { height:40px; }
    .header-bg { display:flex; height:10px; }
    .color-red{flex:1;background:#e74c3c}.color-blue{flex:1;background:#3498db}.color-yellow{flex:1;background:#f1c40f}
    .container { width:95%; max-width:1200px; margin:20px auto; background:white; padding:20px;
                 border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,.1); }
    .search-bar { text-align:center; margin:12px 0; }
    .search-bar input { width:80%; padding:12px; border:2px solid #3498db; border-radius:25px; text-align:center; font-size: 1rem; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th,td { border:1px solid #ddd; padding:8px; text-align:center; }
    th { background:#f2f2f2; }
    .download-btn { background:#3498db; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; margin: 5px; }
    
    /* STYLE BARU UNTUK SCANNER */
    #reader { width: 100%; max-width: 400px; margin: 10px auto; border-radius: 8px; overflow: hidden; display: none; border: 2px solid #3498db; }
    .btn-scanner { background: #8e44ad; color: white; padding: 15px; width: 100%; max-width: 400px; border-radius: 50px; font-weight: bold; border: none; cursor: pointer; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="header-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9d/Logo_Indomaret.png" alt="Logo Indomaret">
    <h1 style="font-size: 1.2em;">STOCK OPNAME T3EI</h1>
    <div></div>
  </div>
  <div class="header-bg"><div class="color-red"></div><div class="color-blue"></div><div class="color-yellow"></div></div>

  <div class="container">
    <div style="text-align: center;">
        <button id="btnToggleScan" class="btn-scanner" onclick="toggleScanner()">📷 Buka Scanner Kamera</button>
        <div id="reader"></div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Cari PLU atau Nama Barang..." oninput="performSearch()" />
    </div>

    <table id="stokTable">
      <thead>
        <tr>
          <th>No</th><th>PLU</th><th>Nama Barang</th><th>Stok Sistem</th><th>Stok Fisik</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyDlaMjPJDQPQMZMTPSLDOuI_j47kKJEJmSWK",
        authDomain: "barcode-qscv.firebaseapp.com",
        databaseURL: "https://barcode-qscv-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "barcode-qscv",
        storageBucket: "barcode-qscv.appspot.com",
        messagingSenderId: "204134538515",
        appId: "1:204134538515:web:394a3880ced41726950eeb"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const stockOpnameRef = database.ref('stock_opname');
    
    let allItems = [];
    let html5QrCode;

    // --- PERBAIKAN LOGIKA SCANNER ---
    async function toggleScanner() {
        const readerDiv = document.getElementById('reader');
        const btn = document.getElementById('btnToggleScan');

        if (!html5QrCode || !html5QrCode.isScanning) {
            readerDiv.style.display = 'block';
            btn.innerText = "❌ Tutup Scanner";
            btn.style.background = "#c0392b";
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }
            
            const config = { fps: 15, qrbox: { width: 250, height: 150 } };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    // Berhasil Scan
                    document.getElementById('searchInput').value = decodedText;
                    performSearch(); // Jalankan pencarian di tabel
                    
                    if (navigator.vibrate) navigator.vibrate(100); // Getar HP
                    
                    // Otomatis fokus ke input stok fisik barang tersebut
                    setTimeout(() => {
                        const targetInput = document.querySelector(`input[data-plu="${decodedText}"]`);
                        if (targetInput) {
                            targetInput.focus();
                            stopScanning(); // Tutup kamera agar hemat baterai
                        }
                    }, 500);
                }
            ).catch(err => {
                console.error(err);
                alert("Kamera Error: Pastikan pakai HTTPS dan izinkan akses kamera.");
                stopScanning();
            });
        } else {
            stopScanning();
        }
    }

    function stopScanning() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                const btn = document.getElementById('btnToggleScan');
                btn.innerText = "📷 Buka Scanner Kamera";
                btn.style.background = "#8e44ad";
            });
        }
    }

    // --- LOGIKA DATA ---
    function performSearch() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#stokTable tbody tr');
        rows.forEach(tr => {
            const plu = tr.cells[1].textContent.toLowerCase();
            const nama = tr.cells[2].textContent.toLowerCase();
            tr.style.display = (plu.includes(q) || nama.includes(q)) ? '' : 'none';
        });
    }

    function renderTable() {
        const tableBody = document.querySelector('#stokTable tbody');
        tableBody.innerHTML = '';
        allItems.forEach((it, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${it.plu}</td>
                <td style="text-align:left;">${it.nama}</td>
                <td>${it.stokSistem || 0}</td>
                <td>
                    <input type="number" data-plu="${it.plu}" value="${it.stokFisik || ''}" 
                           onblur="updateStok('${it.plu}', this)" style="width:80px; padding:5px;">
                </td>
            `;
            tableBody.appendChild(tr);
        });
    }

    function updateStok(plu, inputEl) {
        const item = allItems.find(i => String(i.plu) === String(plu));
        if (item) {
            item.stokFisik = parseInt(inputEl.value) || 0;
            stockOpnameRef.update({ list: allItems });
        }
    }

    function loadData() {
        stockOpnameRef.child('list').once('value').then(snap => {
            allItems = snap.val() || [];
            renderTable();
        });
    }

    // Load data saat halaman dibuka
    loadData();
  </script>
</body>
</html>
